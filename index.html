<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Admission Registration Form</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f1f1;
      padding: 30px;
    }
    .form-container {
      background: white;
      max-width: 600px;
      margin: 0 auto;
      padding: 25px 50px;
      border-radius: 5px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
    }
h2 {
      margin-bottom: 20px;
      color: #333;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
      color: #444;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    .radio-group {
      margin-top: 5px;
    }
    .radio-group label {
      font-weight: normal;
      margin-right: 15px;
      display: inline-block;
    }
    input[type="radio"] {
      margin-right: 5px;
      vertical-align: middle;
    }
    button {
      margin-top: 25px;
      width: 100%;
      padding: 10px;
      background-color: #007BFF;
      color: white;
      border: none;
      font-size: 18px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background-color: #0056b3;
    }
    @media (max-width: 460px) {
      .form-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>College Admission Registration</h2>
    <form action="#" method="POST">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" placeholder="Your full name" required />

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="Your phone number" required />

      <label>Gender</label>
      <div class="radio-group">
        <input type="radio" id="gender_male" name="gender" value="male" required />
        <label for="gender_male">Male</label>
        <input type="radio" id="gender_female" name="gender" value="female" />
        <label for="gender_female">Female</label>
        <input type="radio" id="gender_other" name="gender" value="other" />
        <label for="gender_other">Other</label>
      </div>

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" required />

      <label for="parent_name">Parent/Guardian Name</label>
      <input type="text" id="parent_name" name="parent_name" required />

      <label for="parent_phone">Parent/Guardian Phone Number</label>
      <input type="tel" id="parent_phone" name="parent_phone" required />

      <label for="address">Address</label>
      <textarea id="address" name="address" placeholder="Your current address" required></textarea>

      <label for="course">Applying For</label>
      <select id="course" name="course" required>
        <option value="">-- Select Course --</option>
        <option value="computer-science">Computer Science</option>
        <option value="engineering">Engineering</option>
        <option value="biology">Biology</option>
      </select>

      <label for="previous_education">Previous Education</label>
      <textarea id="previous_education" name="previous_education" placeholder="Briefly describe your previous education" required></textarea>

      <label for="percentage">Percentage/Grades</label>
      <input type="number" id="percentage" name="percentage" min="0" max="100" placeholder="Enter your score" required />

      <label for="payment_method">Payment Method</label>
      <select id="payment_method" name="payment_method" required>
        <option value="">-- Select Payment Method --</option>
        <option value="credit-card">Credit Card</option>
        <option value="debit-card">Debit Card</option>
        <option value="bank-transfer">Bank Transfer</option>
      </select>

      <button type="submit">Submit Application</button>
    </form>
  </div>
</body>
</html>
